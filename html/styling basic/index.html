<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Styling Basics</title>

    <style>
        h1 {
            color: blue;
        }

        p {
            font-size: 20px;
        }

        .penting {
            color: red;
        }
    </style>
</head>
<body>

    <h1>Belajar Styling</h1>

    <p>
        CSS digunakan untuk mengatur tampilan halaman HTML.
    </p>

    <p class="penting">
        Ini adalah informasi penting.
    </p>

</body>
</html>
