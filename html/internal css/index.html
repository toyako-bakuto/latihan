<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Internal CSS</title>

    <style>
        h1 {
            color: blue;
        }

        p {
            color: green;

        }

        .penting {

        }

<body>

    <h1>Belajar Internal CSS</h1>

    <p>
        Saya sedang belajar menggunakan Internal CSS.
    </p>

    <p class="penting">
        Ini adalah informasi penting.
    </p>

</body>
</html>
