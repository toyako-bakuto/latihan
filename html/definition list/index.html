<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <title>Definition Lists</title>
</head>
<body>

    <h1>Definition Lists</h1>

    <h2>Istilah dalam Web</h2>

    <dl>

        <dt>HTML</dt>
        <dd>
            Bahasa markup yang digunakan untuk membuat struktur halaman web.
        </dd>

        <dt>CSS</dt>
        <dd>
            Bahasa yang digunakan untuk mengatur tampilan halaman web.
        </dd>

        <dt>JavaScript</dt>
        <dd>
            Bahasa pemrograman yang digunakan untuk membuat halaman web menjadi interaktif.
        </dd>

    </dl>

</body>
</html>
