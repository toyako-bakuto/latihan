<!DOCTYPE html>

    <title>Q Element</title>
</head>
<body>

    <h1>Q Element</h1>

    <h2>Contoh Kutipan Pendek</h2>

    <p>
        Guru saya berkata,
        <q>Jangan pernah berhenti belajar.</q>
    </p>

    <p>
        Ayah saya selalu mengatakan,
        <q>Kerjakan sesuatu dengan sungguh-sungguh.</q>
    </p>

</body>
