<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form Validation</title>
</head>
<body>

    <h1>Form Validation</h1>

    <form>

        <label for="nama">Nama:</label>
        <input
            type="text"
            id="nama"
            name="nama"
            required
        >

        <br><br>

        <label for="email">Email:</label>
        <input
            type="email"
            id="email"
            name="email"
            required
        >

        <br><br>

        <label for="umur">Umur:</label>
        <input
            type="number"
            id="umur"
            name="umur"
            min="17"
            max="100"
            required
        >

        <br><br>

        <label for="password">Password:</label>
        <input
            type="password"
            id="password"
            name="password"
            minlength="8"
            required
        >

        <br><br>

        <button type="submit">Kirim</button>

    </form>

</body>
</html>
