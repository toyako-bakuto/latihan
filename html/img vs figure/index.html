<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Img vs Figure</title>
</head>
<body>

    <h1>Img vs Figure</h1>

    <h2>Menggunakan img</h2>

    <img
        src="gambar.jpg"
        alt="Pemandangan alam"
        width="400"
    >

    <h2>Menggunakan figure</h2>

    <figure>
        <img
            src="gambar.jpg"
            alt="Pemandangan alam"
            width="400"
        >

        <figcaption>
            Gambar pemandangan alam.
        </figcaption>
    </figure>

</body>
</html>
