<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Subscript Text</title>
</head>
<body>

    <h1>Subscript Text</h1>

    <p>
        Rumus air adalah H<sub>2</sub>O.
    </p>

    <p>
        Rumus karbon dioksida adalah CO<sub>2</sub>.
    </p>

    <p>
        Contoh lainnya adalah O<sub>2</sub>.
    </p>

</body>
</html>
