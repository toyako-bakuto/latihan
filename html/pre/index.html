<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Pre Tag</title>
</head>
<body>

    <h1>Belajar Pre Tag</h1>

    <pre>
Halo, saya Jonathan.
Saya sedang belajar HTML.
        Teks ini memiliki spasi.
    </pre>

    <h2>Contoh Kode</h2>

    <pre>

&lt;p&gt;Saya sedang belajar HTML.&lt;/p&gt;
    </pre>

</body>
</html>
