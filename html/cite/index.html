<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cite Element</title>
</head>
<body>

    <h1>Cite Element</h1>

    <h2>Contoh Buku</h2>

    <p>
        Saya sedang membaca buku
        <cite>Laskar Pelangi</cite>
        karya Andrea Hirata.
    </p>

    <h2>Contoh Film</h2>

    <p>
        Film yang saya sukai adalah
        <cite>Interstellar</cite>.
    </p>

    <h2>Contoh Lagu</h2>

    <p>
        Saya sedang mendengarkan lagu
        <cite>Imagine</cite>
        karya John Lennon.
    </p>

</body>
</html>
