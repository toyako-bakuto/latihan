<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ins Element</title>
</head>
<body>

    <h1>Ins Element</h1>

    <h2>Perubahan Harga</h2>

    <p>
        Harga lama:
        <del>Rp100.000</del>
    </p>

    <p>
        Harga baru:
        <ins>Rp75.000</ins>
    </p>

    <h2>Perubahan Informasi</h2>

    <p>
        Acara akan dilaksanakan pada
        <del>Senin</del>
        <ins>Selasa</ins>.
    </p>

</body>
</html>
