<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Style Attribute</title>
</head>
<body>

    <h1 style="color: blue;">
        Belajar HTML
    </h1>

    <p style="color: red;">
        Ini adalah paragraf berwarna merah.
    </p>

    <p style="font-size: 20px;">
        Teks ini memiliki ukuran lebih besar.
    </p>

    <p style="background-color: yellow;">
        Teks ini memiliki warna latar kuning.
    </p>

</body>
</html>
