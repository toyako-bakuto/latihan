<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Basic HTML Tags</title>
</head>
<body>

    <h1>Belajar HTML</h1>

    <h2>Basic HTML Tags</h2>

    <p>
        HTML digunakan untuk membuat struktur sebuah halaman web.
    </p>

    <hr>

    <h3>Daftar Materi</h3>

    <ul>
        <li>Heading</li>
        <li>Paragraph</li>
        <li>Link</li>
        <li>Image</li>
    </ul>

    <p>
        Kunjungi
        <a href="https://www.google.com">Google</a>
        untuk mencari informasi.
    </p>

    <img src="gambar.jpg" alt="Contoh gambar" width="300">

    <p>
        Ini adalah teks <strong>penting</strong> dan
        <em>teks yang ditekankan</em>.
    </p>

    <br>

    <p>Terima kasih sudah belajar HTML.</p>

</body>
</html>
