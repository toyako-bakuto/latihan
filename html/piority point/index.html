<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Priority Hints</title>
</head>
<body>

    <h1>Priority Hints</h1>

    <h2>Gambar Utama</h2>

    <img 
        src="banner.jpg" 
        alt="Banner utama"
        width="600"
        fetchpriority="high"
    >

    <h2>Gambar Tambahan</h2>

    <img 
        src="gambar1.jpg" 
        alt="Gambar tambahan 1"
        width="300"
        fetchpriority="low"
    >

    <img 
        src="gambar2.jpg" 
        alt="Gambar tambahan 2"
        width="300"
        fetchpriority="low"
    >

</body>
</html>
