<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>B dan Strong</title>
</head>
<body>

    <h1>Belajar B dan Strong</h1>

    <p>
        Ini adalah teks <b>tebal</b> menggunakan tag b.
    </p>

    <p>
        Ini adalah teks <strong>penting</strong> menggunakan tag strong.
    </p>

    <p>
        Jangan lupa untuk <strong>menyimpan pekerjaan</strong>
        sebelum menutup halaman.
    </p>

</body>
</html>
