<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Textual Tags</title>
</head>
<body>

    <h1>Textual Tags</h1>

    <h2>Contoh Teks</h2>

    <p>
        Ini adalah sebuah paragraf dalam HTML.
    </p>

    <p>
        Teks ini memiliki <strong>penekanan penting</strong>.
    </p>

    <p>
        Teks ini menggunakan <em>penekanan</em>.
    </p>

    <p>
        Saya sedang belajar <mark>HTML</mark>.
    </p>

    <p>
        Harga sebelumnya <del>Rp100.000</del>
        menjadi Rp75.000.
    </p>

    <p>
        Rumus air adalah H<sub>2</sub>O.
    </p>

    <p>
        Contoh pangkat: 10<sup>2</sup>.
    </p>

    <p>
        <small>Ini adalah teks berukuran lebih kecil.</small>
    </p>

</body>
</html>
