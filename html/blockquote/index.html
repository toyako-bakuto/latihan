<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Blockquote Element</title>
</head>
<body>

    <h1>Blockquote Element</h1>

    <h2>Kutipan</h2>

    <blockquote>
        Pendidikan adalah senjata paling ampuh yang bisa digunakan
        untuk mengubah dunia.
    </blockquote>

    <p>
        Kutipan tersebut sering dikaitkan dengan Nelson Mandela.
    </p>

</body>
</html>
